<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e0820f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كارت الخبر">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="kart.webmanifest">
<link rel="apple-touch-icon" href="kart-icon-180.png">
<link rel="icon" href="kart-icon-192.png">
<title>كارت الخبر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;700;800&family=Cairo:wght@700;800&family=Almarai:wght@700;800&family=Tajawal:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
html,body{margin:0}body{padding-top:max(16px,env(safe-area-inset-top,0px))!important}
/* Layout: card preview pinned on top, editing form below, one column on phone, two columns on desktop */
:root{
  --bg:#f3f1ec; --panel:#ffffff; --ink:#1b1712; --muted:#6f665b; --line:#e2ddd4;
  --accent:#e0820f; --accent-ink:#ffffff; --field:#faf8f4; --ok:#2f7a3a;
  --ui:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --display:"Noto Kufi Arabic","Cairo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16130f; --panel:#201c17; --ink:#f1ece4; --muted:#a59a8c; --line:#352f27;
  --accent:#f0962a; --accent-ink:#1b1206; --field:#1a1713; --ok:#6cc27a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16130f; --panel:#201c17; --ink:#f1ece4; --muted:#a59a8c; --line:#352f27;
  --accent:#f0962a; --accent-ink:#1b1206; --field:#1a1713; --ok:#6cc27a; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--ui);font-size:15px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:860px){.wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.stage{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}}
header{max-width:1040px;margin:0 auto 14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0;text-wrap:balance}
header small{color:var(--muted);font-size:13px}
.stage{display:grid;gap:10px;min-width:0}
canvas{width:100%;max-width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(0,0,0,.45);touch-action:none;cursor:grab;background:var(--panel)}
canvas.dragging{cursor:grabbing}
.hint{color:var(--muted);font-size:13px;margin:0}
form{display:grid;gap:16px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
label{display:grid;gap:6px;font-weight:600;font-size:14px}
label span.meta{font-weight:400;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.lab{display:flex;justify-content:space-between;gap:8px}
input[type=text],textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{resize:vertical;min-height:96px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,.pick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.pick{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:8px;padding:12px;background:var(--field);cursor:pointer}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick b{font-weight:600}
.pick .thumb{width:54px;height:54px;border-radius:6px;background:var(--line) center/cover no-repeat;flex:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-weight:400;grid-template-columns:none}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border-radius:8px;padding:12px 18px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1;font-size:16px}
.status{font-size:13px;color:var(--muted);min-height:1.4em;margin:0}
.status.ok{color:var(--ok)}
.out{display:grid;gap:8px}
.out img{width:100%;border-radius:6px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>


<header>
  <h1>كارت الخبر</h1>
  <small>قالب 1080×1350</small>
</header>

<div class="wrap">
  <section class="stage" aria-label="معاينة الكارت">
    <canvas id="cv" width="1080" height="1350"></canvas>
    <p class="hint">اسحب الصورة داخل الكارت لتحريكها، وكبّرها من شريط التكبير</p>
  </section>

  <form id="f" autocomplete="off">
    <label for="title"><span class="lab">العنوان <span class="meta" id="titleMeta"></span></span>
      <input id="title" type="text" value="هنا يكتب العنوان اللافت">
    </label>

    <label for="body"><span class="lab">الخبر المختصر <span class="meta" id="bodyMeta"></span></span>
      <textarea id="body">هنا يكتب الخبر المختصر على شكل سطرين هنا يكتب الخبر المختصر على شكل سطرين</textarea>
    </label>

    <label class="pick" for="photo">
      <span class="thumb" id="thumb"></span>
      <span><b id="photoName">اختر صورة الخبر</b><br><span class="meta">اضغط هنا أو اسحب الصورة إلى الكارت</span></span>
      <input id="photo" type="file" accept="image/*">
    </label>

    <div class="row">
      <label for="zoom">تكبير الصورة <input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></label>
      <label for="font">الخط
        <select id="font">
          <option value="Noto Kufi Arabic">كوفي نوتو</option>
          <option value="Cairo">القاهرة</option>
          <option value="Almarai">المراعي</option>
          <option value="Tajawal">تجوال</option>
        </select>
      </label>
    </div>

    <label class="check" for="strip"><input id="strip" type="checkbox" checked> حذف التشكيل تلقائياً</label>

    <div class="actions">
      <button type="submit" class="primary" id="save">حفظ الكارت كصورة</button>
      <button type="button" id="clear">خبر جديد</button>
    </div>
    <p class="status" id="status" role="status"></p>

    <div class="out" id="out" hidden>
      <p class="hint">إذا لم يظهر خيار الحفظ، اضغط مطولاً على الصورة واحفظها</p>
      <img id="outImg" alt="الكارت الجاهز">
    </div>
  </form>
</div>

const W=1080,H=1350;
const BOX={x:108,y:184,w:865,h:124};          // مستطيل العنوان
const BODY={x:108,w:865,top:330,bottom:525};  // منطقة الخبر المختصر
const PHOTO={x:0,y:586,w:1080,h:629};         // منطقة الصورة

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const tpl=new Image();tpl.src=TPL;
let photo=null,zoom=1,ox=0,oy=0; // ox,oy إزاحة مركز الصورة بوحدات الكارت

try{const f=localStorage.getItem('cardFont');if(f)$('font').value=f}catch(e){}

const TASHKEEL=/[ً-ْٰـ]/g;
const clean=s=>($('strip').checked?s.replace(TASHKEEL,''):s).replace(/\s+/g,' ').trim();

function fontStr(size,w){return `${w} ${size}px "${$('font').value}", "Noto Kufi Arabic", sans-serif`}

function wrap(text,size,maxW,weight){
  ctx.font=fontStr(size,weight);
  const words=text.split(' '),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;
    if(ctx.measureText(t).width<=maxW||!cur)cur=t;else{lines.push(cur);cur=w}}
  if(cur)lines.push(cur);return lines;
}

function photoGeom(){
  const base=Math.max(PHOTO.w/photo.width,PHOTO.h/photo.height)*zoom;
  const dw=photo.width*base,dh=photo.height*base;
  const mx=(dw-PHOTO.w)/2,my=(dh-PHOTO.h)/2;
  ox=Math.max(-mx,Math.min(mx,ox));oy=Math.max(-my,Math.min(my,oy));
  return{dw,dh,dx:PHOTO.x+(PHOTO.w-dw)/2+ox,dy:PHOTO.y+(PHOTO.h-dh)/2+oy};
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(tpl.complete)ctx.drawImage(tpl,0,0,W,H);
  ctx.save();ctx.beginPath();ctx.rect(PHOTO.x,PHOTO.y,PHOTO.w,PHOTO.h);ctx.clip();
  if(photo){const g=photoGeom();ctx.drawImage(photo,g.dx,g.dy,g.dw,g.dh)}
  else{ctx.fillStyle='#ece8e1';ctx.fillRect(PHOTO.x,PHOTO.y,PHOTO.w,PHOTO.h);
    ctx.fillStyle='#9b9184';ctx.font=fontStr(40,700);ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';
    ctx.fillText('صورة الخبر هنا',W/2,PHOTO.y+PHOTO.h/2)}
  ctx.restore();

  ctx.direction='rtl';ctx.textBaseline='middle';

  // العنوان: سطر واحد يصغر حتى يدخل المستطيل
  const title=clean($('title').value);
  let ts=76;ctx.font=fontStr(ts,800);
  while(ts>34&&ctx.measureText(title).width>BOX.w-56){ts-=2;ctx.font=fontStr(ts,800)}
  ctx.fillStyle='#111111';ctx.textAlign='center';
  ctx.fillText(title,BOX.x+BOX.w/2,BOX.y+BOX.h/2+ts*0.06);
  $('titleMeta').textContent=ts<56?'العنوان طويل، الخط صغُر إلى '+ts:'';

  // الخبر المختصر: سطران ويصغر الخط إذا زاد
  const body=clean($('body').value);
  let bs=48,lines=wrap(body,bs,BODY.w,700);
  while(bs>28&&lines.length>2){bs-=2;lines=wrap(body,bs,BODY.w,700)}
  const lh=bs*1.48,center=(BODY.top+BODY.bottom)/2,startY=center-(lines.length-1)*lh/2;
  ctx.font=fontStr(bs,700);ctx.textAlign='right';ctx.fillStyle='#ffffff';
  ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=8;ctx.shadowOffsetY=3;
  lines.forEach((l,i)=>ctx.fillText(l,BODY.x+BODY.w,startY+i*lh));
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  $('bodyMeta').textContent=lines.length>2?'النص أطول من 3 أسطر، اختصره':(lines.length+' / 2 أسطر');
}

async function loadFonts(){
  const f=$('font').value;
  try{await Promise.all([document.fonts.load(`800 70px "${f}"`,'عربي'),document.fonts.load(`700 46px "${f}"`,'عربي')])}catch(e){}
  draw();
}

function setPhoto(file){
  if(!file||!file.type.startsWith('image/'))return;
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{photo=im;zoom=1;ox=0;oy=0;$('zoom').value=1;
    $('thumb').style.backgroundImage=`url(${url})`;$('photoName').textContent=file.name||'صورة';draw()};
  im.src=url;
}

tpl.onload=draw;
['title','body'].forEach(id=>$(id).addEventListener('input',draw));
$('strip').addEventListener('change',draw);
$('font').addEventListener('change',()=>{try{localStorage.setItem('cardFont',$('font').value)}catch(e){}loadFonts()});
$('zoom').addEventListener('input',e=>{zoom=+e.target.value;draw()});
$('photo').addEventListener('change',e=>setPhoto(e.target.files[0]));

// سحب الصورة
let drag=null;
cv.addEventListener('pointerdown',e=>{
  if(!photo)return;const r=cv.getBoundingClientRect(),k=W/r.width;
  const y=(e.clientY-r.top)*k;if(y<PHOTO.y||y>PHOTO.y+PHOTO.h)return;
  drag={x:e.clientX,y:e.clientY,ox,oy,k};cv.setPointerCapture(e.pointerId);cv.classList.add('dragging');
});
cv.addEventListener('pointermove',e=>{if(!drag)return;ox=drag.ox+(e.clientX-drag.x)*drag.k;oy=drag.oy+(e.clientY-drag.y)*drag.k;draw()});
const end=()=>{drag=null;cv.classList.remove('dragging')};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
cv.addEventListener('dragover',e=>e.preventDefault());
cv.addEventListener('drop',e=>{e.preventDefault();setPhoto(e.dataTransfer.files[0])});
document.addEventListener('paste',e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it)setPhoto(it.getAsFile())});

$('clear').addEventListener('click',()=>{
  $('title').value='';$('body').value='';photo=null;$('photo').value='';
  $('thumb').style.backgroundImage='';$('photoName').textContent='اختر صورة الخبر';
  $('out').hidden=true;$('status').textContent='';draw();$('title').focus();
});

$('f').addEventListener('submit',e=>{
  e.preventDefault();draw();
  const st=$('status');st.className='status';st.textContent='جاري التجهيز…';
  cv.toBlob(async blob=>{
    if(!blob){st.textContent='تعذر تجهيز الصورة، حاول مرة أخرى';return}
    const url=URL.createObjectURL(blob);
    $('outImg').src=url;$('out').hidden=false;
    const name=(clean($('title').value).split(' ').slice(0,4).join('-')||'khabar')+'.jpg';
    const file=new File([blob],name,{type:'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});st.className='status ok';st.textContent='تم، اختر حفظ الصورة من القائمة';return}
      catch(err){if(err&&err.name==='AbortError'){st.textContent='أُلغي، الصورة موجودة في الأسفل';return}}
    }
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    st.className='status ok';st.textContent='تم الحفظ، وإن لم يُحفظ اضغط مطولاً على الصورة في الأسفل';
  },'image/jpeg',0.95);
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('kart-sw.js').catch(()=>{});

draw();loadFonts();
</script>

</body></html>
